name: Integration Tests

on:
  push:
    branches:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: true
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Set up Dependencies
        uses: actions/setup-python@v4
      - name: Install trec-auto-judge from the repo
        working-directory: ${{github.workspace}}
        run: |
          pip3 install .[test]
          pip3 install --no-deps ir_datasets

      - name: Test judges/naive
        run: |
          tira-cli code-submission \
            --dry-run \
            --path . \
            --task trec-auto-judge \
            --dataset kiddie-20260605-training \
            --command 'auto-judge run --workflow /auto-judge/judges/naive/workflow.yml --rag-responses $inputDataset/runs/*/ --rag-topics $inputDataset/topics/*.jsonl --out-dir $outputDir'

      - name: Test judges/tinyjudge
        run: |
          tira-cli code-submission \
            --dry-run \
            --path . \
            --forward-environment-variable OPENAI_BASE_URL OPENAI_MODEL OPENAI_API_KEY \
            --task trec-auto-judge \
            --dataset kiddie-20260605-training \
            --command 'auto-judge run --workflow /auto-judge/judges/tinyjudge/workflow.yml --rag-responses $inputDataset/runs/*/ --rag-topics $inputDataset/topics/*.jsonl --out-dir $outputDir'

